name: Vercel Main Preview Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-main-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy-preview:
    name: Deploy Preview From Main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel Token
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "Missing GitHub secret: VERCEL_TOKEN"
          echo "Create a Vercel access token, then add it to this repository's Actions secrets."
          exit 1

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Preview Environment
        run: vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}

      - name: Build Preview Artifacts
        run: vercel build --target=preview --token=${{ env.VERCEL_TOKEN }}

      - name: Deploy Preview Artifacts
        run: vercel deploy --prebuilt --target=preview --token=${{ env.VERCEL_TOKEN }}
